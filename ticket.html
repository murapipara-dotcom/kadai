<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>有料観覧席チケット購入 | 墨田区花火大会</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="ticket-page">
    <header class="ticket-header">
      <a href="index.html" class="back-button">← ホームへ戻る</a>
      
    </header>

    <main class="ticket-container">
      <h1>有料観覧席 チケット選択</h1>
      <p class="ticket-lead">
        ご希望の観覧エリアを選択して決済にお進みください。
      </p>

      <!-- チケット一覧エリア -->
      <div class="ticket-list">
        <!-- A席 -->
        <a
          href="https://buy.stripe.com/test_3cI6oI7Xj2ab3WCfsGe7m00"
          class="ticket ticket-a"
          target="_blank"
          rel="noopener noreferrer"
        >
          <div class="ticket-badge">1番人気</div>
          <h2>A席（特等席）</h2>
          <p class="ticket-desc">
            迫力満点！花火を正面から鑑賞できるプレミアムエリア
          </p>
          <span class="btn-buy">A席を購入する</span>
        </a>

        <!-- B席 -->
        <a
          href="https://buy.stripe.com/test_14A9AU0uR7uv3WC1BQe7m01"
          class="ticket ticket-b"
          target="_blank"
          rel="noopener noreferrer"
        >
          <h2>B席（マス席）</h2>
          <p class="ticket-desc">
            ご家族・お友達同士でゆったり楽しめるグループエリア
          </p>
          <span class="btn-buy">B席を購入する</span>
        </a>

        <!-- C席 -->
        <a
          href="https://buy.stripe.com/test_eVq5kEelH02378Ocgue7m02"
          class="ticket ticket-c"
          target="_blank"
          rel="noopener noreferrer"
        >
          <h2>C席（一般指定席）</h2>
          <p class="ticket-desc">全体を見渡せるリーズナブルな観覧エリア</p>
          <span class="btn-buy">C席を購入する</span>
        </a>
      </div>

 

    <footer>
      <p>&copy; 2026 墨田区花火大会 実行委員会</p>
    </footer>
  </body>
</html>
